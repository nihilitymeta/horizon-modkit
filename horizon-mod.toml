id = "horizon_modkit"
name = "Horizon Modkit"
version = "0.7.1"
description = "A library for mods written in Lua: entities, blocks and goals as classes with lifecycle callbacks."
authors = ["whos-carmen"]
api = "0.2"
side = "both"
# scripts: the library is Lua that other mods `require` (they list `depends = ["horizon_modkit"]`);
# registries: its own item, the inspect stick (scripts/registry.lua).
capabilities = ["registries", "scripts"]
experimental = ["scripts"]
